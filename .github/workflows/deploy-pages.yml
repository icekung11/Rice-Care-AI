name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ricecare_frontend_addon/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: ricecare_frontend_addon
      - name: Build frontend
        run: npm run build:pages
        working-directory: ricecare_frontend_addon
        env:
          VITE_API_URL: https://rice-care-ai-qx69.onrender.com
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ricecare_frontend_addon/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
